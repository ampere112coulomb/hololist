<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hololist LIVE</title>
<style>
  * { box-sizing: border-box; }
  :root { color-scheme: light; }
  body {
    margin: 0;
    background: #fff;
    color: #080808;
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  }
  .belt {
    --card-width: clamp(146px, 28.5vw, 194px);
    width: 100%;
    margin: 29px auto 0;
    padding: 76px 0 21px;
    display: grid;
    align-content: end;
    min-height: calc((122px + var(--card-width) * 0.5625) * 1.4);
    overflow: hidden;
    position: relative;
    isolation: isolate;
    container-type: inline-size;
    background-color: #31b0f4;
    background-image: url("./LIVE_background.png");
    background-position: center;
    background-repeat: no-repeat;
    background-size: 100% max(100%, 56.25vw);
  }
  .belt::before {
    content: attr(data-label);
    position: absolute;
    z-index: -1;
    top: 17px;
    left: 30px;
    color: #a2ddfa;
    font: 1000 clamp(72.8px, 15.4cqw, 106.4px)/1 Arial, sans-serif;
    pointer-events: none;
  }
  [hidden] { display: none !important; }
  .track { display: flex; width: max-content; will-change: transform; }
  .group {
    display: flex;
    gap: clamp(12px, 3.2cqw, 22px);
    padding-right: clamp(12px, 3.2cqw, 22px);
  }
  .card {
    width: var(--card-width);
    zoom: 1.4;
    flex: none;
    display: block;
    background: #fff;
    color: inherit;
    text-decoration: none;
    border-radius: 18px 18px 15px 15px;
    overflow: hidden;
  }
  .card:focus-visible { outline: 3px solid #111; outline-offset: -3px; }
  .thumb { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #181818; }
  .details { padding: 3px 5px 7px; }
  .meta { display: flex; align-items: center; gap: 4px; }
  .badge {
    flex: none;
    background: #ff292d;
    color: #fff;
    border-radius: 4px;
    padding: 2px 3px;
    font: 900 9px/1 Arial, sans-serif;
    display: inline-flex;
    align-items: center;
    gap: 2px;
  }
  .badge::before { content: ""; width: .78em; aspect-ratio: 1; border-radius: 50%; background: white; }
  .channel {
    color: #007ebf;
    font-size: 9px;
    font-weight: 900;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .title {
    margin: 4px 2px 0;
    font-size: 10px;
    font-weight: 900;
    line-height: 1.3;
    height: 2.6em;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow-wrap: anywhere;
  }
  .status {
    justify-self: center;
    width: min(calc(100% - 24px), 360px);
    margin: 0 0 8px;
    padding: 12px 16px;
    border-radius: 12px;
    background: #fff;
    font-weight: 700;
  }
  .track { cursor: grab; touch-action: pan-y; }
  .track a { -webkit-user-drag: none; cursor: inherit; }
  .track img { -webkit-user-drag: none; }
  .track.dragging { cursor: grabbing; user-select: none; }
  .step {
    position: absolute;
    z-index: 1;
    transform: translateY(-50%);
    top: 65%;
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 50%;
    background: rgb(0 42 70 / .83);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
  }
  .step:hover, .step:focus-visible { background: #002a46; }
  .previous { left: 8px; }
  .next { right: 8px; }
  .archive {
    margin-top: 0;
    background-color: #367cba;
    background-image: url("./ARCHIVE_background.png");
  }
  .archive::before { color: #397fb2; font-size: clamp(45px, 11cqw, 106.4px); }
  .archive .badge { background: #205782; }
  .archive .badge::before { content: none; }
  .news {
    margin-top: 0;
    background-color: #cfe7f6;
    background-image: url("./NEWS_background.png");
  }
  .news::before { color: #ffece8; text-shadow: 0 2px 4px rgb(100 30 30 / .75); }
  .news .badge { background: #7545a1; }
  .news .badge::before { content: none; }
  .news .thumb { background: #e7edf2; }
  .featured {
    position: relative;
    width: 100%;
    height: 100svh;
    overflow: hidden;
    isolation: isolate;
    background: #10161c;
    color: #fff;
  }
  .featured-copy {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: grid;
    align-content: start;
    gap: clamp(25px, 12vh, 150px);
    padding: clamp(28px, 13vh, 160px) 0 0 2.2%;
    background: #31b0f4;
    clip-path: polygon(0 0, 38.6% 0, 55.3% 100%, 0 100%);
    pointer-events: none;
  }
  .featured-copy h1, .featured-copy p {
    margin: 0;
    width: max-content;
    font-size: clamp(14px, min(4.05vw, 8vh), 84px);
    font-weight: 900;
    line-height: 1.45;
  }
  .featured-version {
    position: absolute;
    bottom: 1.5%;
    right: 46.7%;
    font-size: clamp(16px, 2.65vw, 54px);
    font-weight: 800;
  }
  .featured-video {
    position: absolute;
    inset: 0 0 0 38.5%;
    overflow: hidden;
    background: #10161c;
  }
  .featured-video::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgb(0 0 0 / .8), transparent 26%, transparent 78%, rgb(0 0 0 / .48));
    pointer-events: none;
  }
  .featured-heading {
    position: absolute;
    z-index: 1;
    top: clamp(10px, 2vh, 25px);
    left: 3.5%;
    right: 5%;
    display: flex;
    gap: clamp(8px, 1.15vw, 22px);
    align-items: flex-start;
    pointer-events: none;
  }
  .featured-heading .badge {
    border-radius: .5em;
    padding: .4em .8em;
    font-size: clamp(7px, 1.3vw, 26px);
  }
  #featured-title {
    margin: 0;
    align-self: center;
    font-size: clamp(14px, 1.55vw, 32px);
    line-height: 1.45;
    overflow-wrap: anywhere;
    text-shadow: 0 1px 4px #000;
  }
  #featured-player {
    pointer-events: none;
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    width: max(100%, 177.78svh);
    height: max(100%, 34.6vw);
    display: block;
    border: 0;
    background: #000;
  }
  #featured-status {
    position: absolute;
    z-index: 1;
    top: 48%;
    right: 7%;
    left: 24%;
    margin: 0;
    text-align: center;
  }
  .featured + .belt { margin-top: 0; }
  @media (max-width: 700px) and (orientation: portrait) {
    .featured {
      display: grid;
      grid-template-rows: auto minmax(250px, 1fr);
      height: auto;
      min-height: 100svh;
    }
    .featured-copy { position: relative; inset: auto; clip-path: none; padding: 20px 18px 40px; gap: 10px; }
    .featured-copy h1, .featured-copy p { font-size: clamp(21px, 6vw, 34px); }
    .featured-version { right: 18px; bottom: 8px; }
    .featured-video { position: relative; inset: auto; }
    #featured-player { width: 100%; height: 100%; }
    #featured-status { left: 7%; }
  }
</style>
</head>
<body>
<main>
  <section class="featured" aria-label="ピックアップライブ">
    <div class="featured-copy">
      <h1>推し活を<br>更に質の高いものへ</h1>
      <p>推し活を<br>更に楽しいものへ</p>
      <span class="featured-version">hololist ver.2</span>
    </div>
    <div class="featured-video">
      <p id="featured-status" role="status">配信を取得中…</p>
      <div id="featured-heading" class="featured-heading" hidden>
        <span class="badge">LIVE</span>
        <h2 id="featured-title"></h2>
      </div>
      <iframe id="featured-player" title="ピックアップライブ" tabindex="-1" inert hidden
        allow="autoplay; encrypted-media"
        referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
  </section>
  <section class="belt" data-label="LIVE" aria-label="LIVE">
    <div id="live-track" class="track" aria-label="ライブ配信中の枠" hidden></div>
    <button class="step previous" type="button" aria-label="ライブの前の4枠へ" aria-controls="live-track" hidden>◀</button>
    <button class="step next" type="button" aria-label="ライブの次の4枠へ" aria-controls="live-track" hidden>▶</button>
    <p class="status" role="status">配信を取得中…</p>
  </section>
  <section class="belt archive" data-label="ARCHIVE" aria-label="ARCHIVE">
    <div id="archive-track" class="track" aria-label="直近12時間に終了した配信" hidden></div>
    <button class="step previous" type="button" aria-label="アーカイブの前の4枠へ" aria-controls="archive-track" hidden>◀</button>
    <button class="step next" type="button" aria-label="アーカイブの次の4枠へ" aria-controls="archive-track" hidden>▶</button>
    <p class="status" role="status">アーカイブを取得中…</p>
  </section>
  <section class="belt news" data-label="NEWS" aria-label="NEWS">
    <div id="news-track" class="track" aria-label="Instagramの最新投稿" hidden></div>
    <button class="step previous" type="button" aria-label="ニュースの前の4件へ" aria-controls="news-track" hidden>◀</button>
    <button class="step next" type="button" aria-label="ニュースの次の4件へ" aria-controls="news-track" hidden>▶</button>
    <p class="status" role="status">Instagramの投稿を取得中…</p>
  </section>
</main>
<template id="card-template">
  <a class="card" target="_blank" rel="noopener noreferrer">
    <img class="thumb" alt="" referrerpolicy="no-referrer">
    <div class="details">
      <div class="meta"><span class="badge">LIVE</span><span class="channel"></span></div>
      <p class="title"></p>
    </div>
  </a>
</template>
<script>
  "use strict";
  const apiKey = "1f0fbcba-f11a-4a42-8647-ec4d3dc2f90c";
  const template = document.querySelector("#card-template");
  const refreshInterval = 60_000;
  const speed = 48;
  const archiveWindow = 12 * 60 * 60 * 1000;

  async function fetchVideos(path, params) {
    const query = new URLSearchParams({ org: "Hololive", type: "stream", ...params });
    const response = await fetch("https://holodex.net/api/v2/" + path + "?" + query, {
      headers: { "X-APIKEY": apiKey },
      signal: AbortSignal.timeout(15_000),
      cache: "no-store"
    });
    if (!response.ok) {
      const error = new Error("Holodex returned " + response.status);
      error.status = response.status;
      throw error;
    }
    const videos = await response.json();
    if (!Array.isArray(videos)) throw new Error("Invalid Holodex response");
    return videos;
  }

  async function loadArchive() {
    const now = Date.now();
    const cutoff = now - archiveWindow;
    const limit = 50;
    const archives = [];
    for (let offset = 0; ; offset += limit) {
      const page = await fetchVideos("videos", {
        status: "past", include: "live_info", sort: "end_actual", order: "desc", limit, offset
      });
      for (const video of page) {
        const endedAt = Date.parse(video?.end_actual);
        if (video?.status === "past" && endedAt >= cutoff && endedAt <= now) archives.push(video);
      }
      if (page.length < limit || !(Date.parse(page.at(-1)?.end_actual) >= cutoff)) break;
    }
    return archives;
  }

  async function loadNews() {
    if (location.protocol === "file:") {
      throw new Error("NEWSを表示するには、GitHub Pagesまたはローカルサーバーでページを開いてください。");
    }
    const response = await fetch("./news.json", {
      cache: "no-store", signal: AbortSignal.timeout(20_000)
    });
    if (!response.ok) throw new Error("Instagramのカード一覧を取得できませんでした。");
    const result = await response.json();
    if (!Array.isArray(result)) throw new Error("Instagramのデータ形式を確認してください。");
    return result;
  }

  const featuredPlayer = document.querySelector("#featured-player");
  const featuredHeading = document.querySelector("#featured-heading");
  const featuredTitle = document.querySelector("#featured-title");
  const featuredStatus = document.querySelector("#featured-status");
  let featuredId;

  function updateFeatured(videos) {
    let video = videos.find(item => item.id === featuredId);
    video ??= videos[Math.floor(Math.random() * videos.length)];
    if (!video) {
      featuredId = undefined;
      featuredPlayer.removeAttribute("src");
      featuredPlayer.hidden = true;
      featuredHeading.hidden = true;
      featuredStatus.textContent = "現在ライブ配信中の枠はありません";
      featuredStatus.hidden = false;
      return;
    }
    featuredTitle.textContent = video.title;
    featuredPlayer.title = video.title;
    if (video.id !== featuredId) {
      featuredId = video.id;
      featuredPlayer.src = "https://www.youtube.com/embed/" + video.id + "?autoplay=1&mute=1&playsinline=1&rel=0&controls=0&disablekb=1&fs=0";
    }
    featuredPlayer.hidden = false;
    featuredHeading.hidden = false;
    featuredStatus.hidden = true;
  }

  function startBelt(belt, loadVideos, expectedStatus, emptyMessage) {
    const track = belt.querySelector(".track");
    const previous = belt.querySelector(".previous");
    const next = belt.querySelector(".next");
    const status = belt.querySelector(".status");
    let signature = "";
    let position = 0;
    let groupWidth = 0;
    let lastFrame = 0;
    let slide;
    let drag;
    let suppressClick = false;

    function message(text) {
      status.textContent = text;
      status.hidden = !text;
      previous.hidden = track.hidden;
      next.hidden = track.hidden;
    }

    function resizeTrack() {
      if (track.hidden || !track.firstElementChild) return;
      groupWidth = track.firstElementChild.getBoundingClientRect().width;
      const copies = 1 + Math.ceil(belt.clientWidth / groupWidth);
      while (track.children.length > copies) track.lastElementChild.remove();
      while (track.children.length < copies) {
        const copy = track.firstElementChild.cloneNode(true);
        copy.setAttribute("aria-hidden", "true");
        for (const link of copy.querySelectorAll("a")) link.tabIndex = -1;
        track.append(copy);
      }
    }

    function render(videos) {
      if (!videos.length) {
        track.hidden = true;
        message(emptyMessage);
        return;
      }
      track.hidden = false;
      message("");
      const nextSignature = JSON.stringify(videos);
      if (nextSignature !== signature) {
        const group = document.createElement("div");
        group.className = "group";
        for (const video of videos) {
          const card = template.content.firstElementChild.cloneNode(true);
          card.href = video.href || "https://www.youtube.com/watch?v=" + video.id;
          const image = card.querySelector("img");
          const imageUrl = expectedStatus === "news" ? video.image : "https://i.ytimg.com/vi/" + video.id + "/mqdefault.jpg";
          if (imageUrl) image.src = imageUrl;
          card.querySelector(".badge").textContent = belt.dataset.label;
          card.querySelector(".channel").textContent = video.channel;
          card.querySelector(".title").textContent = video.title;
          group.append(card);
        }
        track.replaceChildren(group);
        signature = nextSignature;
      }
      resizeTrack();
    }

    async function refresh() {
      try {
        const results = await loadVideos();
        const videos = new Map();
        for (const video of results) {
          if (video?.status !== expectedStatus || typeof video.id !== "string") continue;
          if (expectedStatus === "news") {
            videos.set(video.id, video);
            continue;
          }
          if (!/^[\w-]{11}$/.test(video.id)) continue;
          videos.set(video.id, {
            id: video.id,
            channel: video.channel?.name || video.channel?.english_name || "チャンネル名なし",
            title: video.title || "タイトルなし"
          });
        }
        const cards = [...videos.values()];
        if (expectedStatus === "live") updateFeatured(cards);
        render(cards);
      } catch (error) {
        if (expectedStatus === "live" && !featuredId) {
          featuredStatus.textContent = "配信情報を取得できませんでした。再試行します。";
        }
        track.hidden = true;
        message(expectedStatus === "news" ? error.message : error.status === 401 || error.status === 403
          ? "Holodex APIキーを確認してください。"
          : "配信情報を取得できませんでした。60秒後に再試行します。");
      } finally {
        setTimeout(refresh, refreshInterval);
      }
    }

    function moveBy(distance) {
      position = ((position + distance) % groupWidth + groupWidth) % groupWidth;
      track.style.transform = "translateX(" + -position + "px)";
    }

    function step(direction) {
      const count = track.firstElementChild?.children.length;
      if (!count || !groupWidth || drag) return;
      const distance = direction * 4 * groupWidth / count;
      slide = { startedAt: performance.now(), distance, applied: 0 };
    }

    function animate(now) {
      const elapsed = Math.min(now - (lastFrame || now), 50);
      lastFrame = now;
      if (!track.hidden && groupWidth && !drag) {
        if (slide) {
          const progress = Math.max(0, Math.min(1, (now - slide.startedAt) / 650));
          const distance = slide.distance * (1 - (1 - progress) ** 3);
          moveBy(distance - slide.applied);
          slide.applied = distance;
          if (progress === 1) slide = undefined;
        } else {
          moveBy(speed * elapsed / 1000);
        }
      }
      requestAnimationFrame(animate);
    }

    previous.addEventListener("click", () => step(-1));
    next.addEventListener("click", () => step(1));

    track.addEventListener("dragstart", event => event.preventDefault());
    track.addEventListener("pointerdown", event => {
      if (!event.isPrimary || event.button !== 0) return;
      suppressClick = false;
      slide = undefined;
      drag = { id: event.pointerId, x: event.clientX, moved: false };
    });

    window.addEventListener("pointermove", event => {
      if (drag?.id !== event.pointerId) return;
      const distance = drag.x - event.clientX;
      if (!drag.moved && Math.abs(distance) < 5) return;
      if (!drag.moved) {
        drag.moved = true;
        track.setPointerCapture(event.pointerId);
        track.classList.add("dragging");
      }
      drag.x = event.clientX;
      moveBy(distance);
    });

    function endDrag(event) {
      if (drag?.id !== event.pointerId) return;
      suppressClick = drag.moved;
      drag = undefined;
      track.classList.remove("dragging");
    }

    window.addEventListener("pointerup", endDrag);
    window.addEventListener("pointercancel", endDrag);
    track.addEventListener("lostpointercapture", endDrag);
    track.addEventListener("click", event => {
      if (!suppressClick || event.detail === 0) return;
      event.preventDefault();
      suppressClick = false;
    }, true);

    window.addEventListener("resize", resizeTrack);
    requestAnimationFrame(animate);
    refresh();
  }

  startBelt(document.querySelector('[data-label="LIVE"]'),
    () => fetchVideos("live", { status: "live" }), "live",
    "現在ライブ配信中の枠はありません");
  startBelt(document.querySelector('[data-label="ARCHIVE"]'),
    loadArchive, "past",
    "直近12時間に終了した配信はありません");
  startBelt(document.querySelector('[data-label="NEWS"]'), loadNews, "news",
    "Instagramの投稿はありません");
</script>
</body>
</html>
